[project]
name = "greenllm"
version = "0.1.0"
description = "Energy-aware gateway for LLM APIs (Anthropic + OpenAI): caching, prompt caching, output caps and energy/carbon metering."
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
greenllm = "greenllm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["greenllm"]
